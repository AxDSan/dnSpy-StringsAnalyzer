name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine Version
        id: version
        run: |
          $LatestTag = $(git describe --tags --abbrev=0 2>$null)
          if ($LastExitCode -ne 0) { $LatestTag = "v0.0.0" }
          $TagVersion = $LatestTag.TrimStart('v')
          $Parts = $TagVersion.Split('.')
          
          # Analizar commits desde el último tag
          $Commits = $(git log $LatestTag..HEAD --pretty=format:"%s")
          $HasBreakingChange = $Commits | Where-Object { $_ -match "^BREAKING CHANGE:" }
          $HasFeature = $Commits | Where-Object { $_ -match "^feat:" }
          $HasFix = $Commits | Where-Object { $_ -match "^fix:" }
          
          if ($HasBreakingChange) {
            $NewVersion = "$([int]$Parts[0] + 1).0.0"
          } elseif ($HasFeature) {
            $NewVersion = "$($Parts[0]).$([int]$Parts[1] + 1).0"
          } elseif ($HasFix) {
            $NewVersion = "$($Parts[0]).$($Parts[1]).$([int]$Parts[2] + 1)"
          } else {
            $NewVersion = "$($Parts[0]).$($Parts[1]).$([int]$Parts[2] + 1)"
          }
          
          echo "new_version=$NewVersion" >> $env:GITHUB_OUTPUT
          echo "New version will be: v$NewVersion"

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Package Files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir publish
          copy dnSpy-StringsAnalyzer\bin\Release\net48\*.dll publish\
          copy dnSpy-StringsAnalyzer\bin\Release\net48\*.pdb publish\
          Compress-Archive -Path publish\* -DestinationPath dnSpy.Extension.StringsAnalyzer.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dnSpy.Extension.StringsAnalyzer.zip
          body: |
            ## dnSpy Strings Analyzer Plugin

            ### Changes in this version:
            - Automatic release from tag ${{ github.ref_name }}

            ### Installation:
            1. Extract the zip file
            2. Copy the DLLs to your dnSpy Extensions folder
            3. Restart dnSpy
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
