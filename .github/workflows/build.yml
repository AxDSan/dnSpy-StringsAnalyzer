name: Build and Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration Release

      - name: Package Files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir publish
          copy dnSpy-StringsAnalyzer\bin\Release\net48\*.dll publish\
          copy dnSpy-StringsAnalyzer\bin\Release\net48\*.pdb publish\
          Compress-Archive -Path publish\* -DestinationPath dnSpy.Extension.StringsAnalyzer.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dnSpy.Extension.StringsAnalyzer.zip
          body: |
            ## dnSpy Strings Analyzer Plugin

            ### Changes in this version:
            - Automatic release from tag ${{ github.ref_name }}

            ### Installation:
            1. Extract the zip file
            2. Copy the DLLs to your dnSpy Extensions folder
            3. Restart dnSpy
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
